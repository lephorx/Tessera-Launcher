[package]
name = "tessera-launcher"
version = "0.6.27"
edition = "2021"

[lib]
name = "tessera_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native roots too: antivirus HTTPS scanning and company proxies sign with their own root, which only the system trusts
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream", "multipart"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
sha2 = "0.10"
fastnbt = "2"
getrandom = "0.3"
tauri-plugin-updater = "2"
# Horizon (Tessera Launcher Nightly): its Linux archives and Rust's toolchain are .tar.gz, its
# release checksums are signed with Ed25519, registry mods with minisign, native mods are TOML
tar = "0.4"
toml = "0.8"
minisign-verify = "0.3"
ed25519-dalek = "2"
libc = "0.2"
# std canonicalize gives \\?\ paths on Windows, which MinGW's gcc and ld can't read
dunce = "1"
tauri-plugin-process = "2"
