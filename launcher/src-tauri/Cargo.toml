[package]
name = "tessera-launcher"
version = "0.2.0"
edition = "2021"

[lib]
name = "tessera_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tokio = { version = "1", features = ["fs", "process", "io-util", "macros", "rt-multi-thread", "sync"] }
futures = "0.3"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
sha2 = "0.10"
fastnbt = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
