# Builds Tessera Launcher for macOS (Apple silicon and Intel), Windows and Linux when a version tag (v1.2.3) is
# pushed, signs the update files and publishes a GitHub release with latest.json, which
# the launcher's updater reads. The release notes are the annotated tag's message.
#
# The release is made as a draft first and only published when every platform built, so
# launchers never see a new version before their own download is there.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace("refs/tags/", ""),
              name: `Tessera Launcher ${context.ref.replace("refs/tags/", "")}`,
              body: fs.readFileSync("notes.md", "utf8").trim(),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        # macOS as two parallel jobs instead of one universal build that compiles twice
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Tag builds can only restore caches made on main; check.yml keeps these warm with the
      # same build, so only the launcher's own code compiles here.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
          shared-key: release-${{ matrix.target }}
          save-if: false

      - run: pnpm install --frozen-lockfile


      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # parallel builds would overwrite each other's latest.json; publish-release writes it
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # one latest.json from every platform's signed files (fails if one is missing)
      - name: Update file for the launcher's updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/updater-json.py "${GITHUB_REF_NAME}" > latest.json
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber -R "${GITHUB_REPOSITORY}"
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number("${{ needs.create-release.outputs.release_id }}"),
              draft: false,
            });
