# Builds Tessera Launcher for macOS (Apple silicon and Intel), Windows and Linux when a version tag (v1.2.3) is
# pushed, signs the update files and publishes a GitHub release with latest.json, which
# the launcher's updater reads. The release notes are the annotated tag's message.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS as two parallel jobs instead of one universal build that compiles twice
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Tag builds can only restore caches made on main; check.yml keeps these warm with the
      # same build, so only the launcher's own code compiles here.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
          shared-key: release-${{ matrix.target }}
          save-if: false

      - run: pnpm install --frozen-lockfile

      - name: Release notes from the tag
        id: notes
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true
          {
            echo 'body<<NOTES_END'
            git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" 2>/dev/null || true
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: launcher
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Tessera Launcher ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
